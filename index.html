<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#F3F9FD;--card:#fff;--tx:#1F2733;--sc:#667085;--bd:#E4E7EC;--sf:#F4F5F7;--y:#00A8E1;--ony:#062A40;--dk:#1C243B;--bl:#3E8FD6;--blb:#E3F0FB;--ok:#1E7A4A;--okb:#E3F4EA;--er:#D92D3A;--wn:#FFF1CC;--wnt:#8A5A00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151C;--card:#1A1F29;--tx:#EEF0F3;--sc:#98A2B3;--bd:#2A303A;--sf:#1F242D;--dk:#2C3446;--bl:#6DB3F2;--blb:#1B2B3D;--ok:#5CD38F;--okb:#153524;--er:#F97066;--wn:#3A2F12;--wnt:#F6BC2F}}
:root[data-theme="dark"]{--bg:#12151C;--card:#1A1F29;--tx:#EEF0F3;--sc:#98A2B3;--bd:#2A303A;--sf:#1F242D;--dk:#2C3446;--bl:#6DB3F2;--blb:#1B2B3D;--ok:#5CD38F;--okb:#153524;--er:#F97066;--wn:#3A2F12;--wnt:#F6BC2F}
*{box-sizing:border-box;margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;font-family:'IBM Plex Sans Arabic',Tajawal,Cairo,system-ui,sans-serif;background:var(--sf);color:var(--tx);display:flex;flex-direction:column}
button,input,a{font:inherit;color:inherit}a{text-decoration:none}
.scr{flex:1;overflow:auto;padding:20px 18px 24px}
h1{font-size:24px;font-weight:600}.t2{font-size:16px;font-weight:600}.sc{color:var(--sc)}.sm{font-size:13px}.b{font-weight:500}
.btn{width:100%;height:58px;background:var(--y);color:var(--ony);border:0;border-radius:14px;font-weight:600;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{background:var(--sf);color:var(--sc);cursor:default}
.b2{height:48px;padding:0 16px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;font-weight:500}
.b2:disabled,.b2.off{opacity:.4;pointer-events:none}
.sq{width:56px;height:56px;border-radius:16px;background:var(--y);color:var(--ony);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:12px}
.card.cur{border:2px solid var(--y)}
.hero{background:var(--dk);color:#fff;border-radius:20px;padding:24px;text-align:center;margin-top:16px}.hero .sc{color:#C3CAD6}
.huge{font-size:72px;font-weight:600;line-height:1.1;margin:4px 0}
.r{display:flex;align-items:center;gap:12px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--okb);color:var(--ok)}
.al{border-radius:14px;padding:14px 16px;margin-top:12px;background:var(--wn);color:var(--wnt);font-weight:500}.al.ok{background:var(--okb);color:var(--ok)}.al.er{background:#FDECEA;color:var(--er)}
.f{display:block;margin-top:16px}.f span{display:block;font-size:13px;color:var(--sc);margin-bottom:6px}
.in{width:100%;height:52px;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:0 14px;font-size:16px}.in:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.pm{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-top:8px;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;cursor:pointer;text-align:start}
.pm.on{border-color:var(--ok)}
.rk{width:36px;height:36px;border-radius:10px;background:var(--sf);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}.rk.on{background:var(--y);color:var(--ony)}
.ac{display:flex;gap:8px;margin-top:12px}.ac .btn{height:48px;font-size:16px;flex:1.4;border-radius:12px}
.ad{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--blb);color:var(--bl);font-size:14px;cursor:pointer}
.ad .tg{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bl);color:#fff}
.lv:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:6px;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.3}}
.md{position:absolute;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:5}.md>div{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:28px 20px 24px;text-align:center}
.toast{position:absolute;inset-inline:16px;bottom:16px;background:var(--dk);color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.toast button{background:none;border:0;color:var(--y);font-weight:600;padding:8px;cursor:pointer}
.row3{display:flex;align-items:center;gap:12px;padding:12px 0}.row3+.row3{border-top:1px solid var(--bd)}

body{height:100%}#dv{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:8px;background:var(--dk);color:#fff;font-size:12px}
#dv button{height:32px;padding:0 12px;border-radius:999px;border:1px solid #ffffff44;background:none;color:#fff;cursor:pointer}
.app{position:relative;flex:1;min-height:0;width:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}.app.wide{max-width:860px}
@media(min-width:600px){.app{border-inline:1px solid var(--bd)}}
.btn.big{height:64px;font-size:22px;flex:1;border-radius:14px}.ac.p{margin-top:8px}
.off{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;background:var(--er);color:#fff;text-align:center;padding:10px 12px;font-size:14px;font-weight:600}
.adi{display:block;margin:12px 0;border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:var(--card)}.adi img{width:100%;height:auto;display:block;-webkit-user-drag:none}
.cl{position:fixed;inset:0;z-index:60;background:rgba(6,24,40,.62);display:flex;align-items:center;justify-content:center;padding:24px}
.cl .cd{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cl .ib{width:72px;height:72px;border-radius:50%;background:var(--y);color:var(--ony);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;animation:cp .7s ease-in-out 5}
.cl h2{font-size:24px;line-height:1.6;margin:6px 0 22px}
@keyframes cp{50%{transform:scale(1.15)}}
.cl textarea{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:12px;font:inherit;font-size:15px;background:var(--card);color:var(--tx);resize:none;-webkit-user-select:text;user-select:text}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}.chip{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.abar{position:sticky;top:0;z-index:5;display:flex;gap:10px;margin:12px -18px 4px;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--bd)}.abar .btn{flex:1;width:auto;height:48px;font-size:15px;margin:0;gap:6px;border-radius:12px;white-space:nowrap}.abar .sec{background:var(--sf);color:var(--tx)}
</style></head><body>
<div id="app" class="app wide"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const DEV=false,SB_URL=TEKO_CFG.url,SB_KEY=TEKO_CFG.key;
const N=n=>n.toLocaleString('en-US'),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),A2=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const now=()=>new Date().toLocaleTimeString('ar-EG-u-nu-latn',{hour:'numeric',minute:'2-digit'});
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const sb=supabase.createClient(SB_URL,SB_KEY);let Q=[],CFG=null,AD=null,KE=0,FIRST=1,CM=0,BK=0,BL=null,TS='',CT='لو مفيش معاك أوردر، احجز دورك دلوقتي';const PRE=['لو مفيش معاك أوردر، احجز دورك دلوقتي','اللي واقف في الموقع يحجز دوره الآن','الدور بيمشي — احجزوا دلوقتي'];const CF=()=>CFG,AD_=()=>AD;
const P={pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',chev:'<path d="M15 18l-6-6 6-6"/>',check:'<path d="M20 6L9 17l-5-5"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const ad=()=>{const a=AD_();if(!(a&&Date.now()<a.end))return'';const u=safeUrl(a.url);if(a.image){const im=`<img src="${E(safeUrl(a.image))}" alt="" draggable="false" onerror="this.closest('.adi').remove()">`;return u=='#'?`<div class="adi">${im}</div>`:`<a class="adi" href="${E(u)}" target="_blank" rel="noopener noreferrer">${im}</a>`}const tx=a.tag==null?'إعلان':a.tag,tg=`${tx?`<span class="tg">${E(tx)}</span>`:''}<span style="flex:1;line-height:1.7">${E(a.text)}</span>`;return u=='#'?`<div class="ad" style="cursor:default">${tg}</div>`:`<a class="ad" href="${E(u)}" target="_blank" rel="noopener noreferrer">${tg}${ic('chev',18)}</a>`};
let AC=null;const ua=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}};['touchstart','click','keydown'].forEach(e=>addEventListener(e,ua,{passive:true}));
const beep=()=>{try{ua();const t=AC.currentTime,g=AC.createGain();g.gain.value=.7;g.connect(AC.destination);for(let i=0;i<12;i++){const o=AC.createOscillator(),e=AC.createGain(),s=t+i*.25;o.type='triangle';o.frequency.value=i%2?1175:880;o.connect(e);e.connect(g);e.gain.setValueAtTime(0,s);e.gain.linearRampToValueAtTime(1,s+.02);e.gain.exponentialRampToValueAtTime(.001,s+.23);o.start(s);o.stop(s+.25)}navigator.vibrate&&navigator.vibrate([400,150,400,150,400,150,400,150,400])}catch(e){}};
const notify=async(t,b)=>{try{if(!window.Notification||Notification.permission!='granted')return;const o={body:b,tag:'teko',renotify:true,vibrate:[200,100,200],icon:'icon-192.png'};const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.showNotification(t,o);else new Notification(t,o)}catch(e){}};
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742e3*Math.asin(Math.sqrt(h))};
let GPS=0,LOC=null,LSIG='';
const chk=()=>{const c=CF();const i=!!(LOC&&c&&dist(LOC.lat,LOC.lng,c.lat,c.lng)<=c.r);if(i!=GPS){GPS=i;return 1}return 0};
const wg=()=>{try{navigator.geolocation.watchPosition(p=>{LOC={lat:p.coords.latitude,lng:p.coords.longitude};if(chk()){render();ST(1)}if(window.onLoc)onLoc()},()=>{},{enableHighAccuracy:true})}catch(e){}};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'#';
setInterval(()=>{const a=AD_();if(a&&Date.now()>a.end&&document.querySelector('.ad'))render()},1000);
document.addEventListener('contextmenu',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
let G=ld('teko-sup',{perm:{l:0,n:0},key:''}),U=null;
{const h=location.hash.match(/k=([^&]+)/);if(h){G.key=decodeURIComponent(h[1]);sv('teko-sup',G);history.replaceState(null,'',location.pathname+location.search)}}
const sg=()=>sv('teko-sup',G),inside=()=>!!CFG&&(!CFG.geo||!!GPS);
if(G.perm.l)wg();
const pm=async k=>{let ok=0;try{if(k=='l'){const r=await new Promise(res=>navigator.geolocation.getCurrentPosition(()=>res(0),e=>res(e.code),{timeout:20000,maximumAge:60000}));ok=r===0;if(ok)wg()}else ok=window.Notification&&(await Notification.requestPermission())=='granted'}catch(e){}if(ok)G.perm[k]=1;sg();render();if(ok&&k=='n')pushSub()};
const syncPerm=async()=>{let ch=0;try{if(navigator.permissions){const g=await navigator.permissions.query({name:'geolocation'});if(g.state=='granted'&&!G.perm.l){G.perm.l=1;wg();ch=1}}}catch(e){}
if(window.Notification&&Notification.permission=='granted'&&!G.perm.n){G.perm.n=1;ch=1}
if(ch){sg();render()}};
syncPerm();document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPerm()});
const need=()=>(G.perm.l&&G.perm.n)?'':`<div class="card" style="margin-top:12px"><div class="b">صلاحيات مطلوبة</div><div class="sc sm">الموقع لتشغيل الأزرار، والإشعارات لتنبيهك بأي حجز جديد</div><div class="ac">${G.perm.l?'':'<button class="b2" onclick="pm(\'l\')">السماح بالموقع</button>'}${G.perm.n?'':'<button class="b2" onclick="pm(\'n\')">تفعيل التنبيهات</button>'}</div></div>`;
const row=(x,i,dis)=>`<div class="card ${i?'':'cur'}"><div class="r"><span class="rk ${i?'':'on'}">${N(i+1)}</span><div style="flex:1;min-width:0"><div class="b">${E(x.name)} ${i?'':'<span class="pill">الدور الآن</span>'}</div><div class="sc sm">حجز ${E(x.t)}</div></div></div>${i?'':`<div class="ac"><button class="btn big" ${dis?'disabled':''} onclick="rc('${E(x.id)}')">استلم</button></div>`}<div class="ac p"><button class="b2" ${dis?'disabled':''} onclick="pp('${E(x.id)}')">تأجيل</button><a class="b2 ${dis?'off':''}" href="tel:${E(x.ph)}">${ic('phone',18)}اتصال</a></div></div>`;
const page=()=>{if(!G.key||KE)return'<div class="scr"><div class="r"><span class="sq">T</span><span class="t2" style="font-size:22px">Teko</span></div><div class="al er">رابط المشرف غير صحيح — افتح الرابط الخاص بالمشرف</div></div>';const dis=!inside();return`<div class="scr"><h1>قائمة الانتظار</h1><div class="sc lv" style="margin-top:4px">مباشر · ${N(Q.length)} طيار في الانتظار</div>${need()}<div class="abar"><button class="btn" ${dis?'disabled':''} onclick="cm(1)">${ic('bell',18)} نداء الطيارين</button><button class="btn sec" ${dis?'disabled':''} onclick="bk(1)">حجز للجميع</button></div>${ad()}${dis?'<div class="al">أنت خارج موقع الاستلام — الأزرار متوقفة</div>':''}${Q.map((x,i)=>row(x,i,dis)).join('')||'<div class="sc" style="text-align:center;padding:48px 0">مفيش طيارين في الانتظار</div>'}</div>${U?`<div class="toast"><span>${E(U.m)}</span><button onclick="undo()">تراجع</button></div>`:''}`};
const cm=v=>{CM=v;render()};
const bk=async v=>{BK=v;BL=null;render();if(!v)return;try{const{data}=await sb.rpc('sup_onsite',{p_key:G.key});BL=data||[]}catch(e){BL=[]}render()};
const doBook=async()=>{if(!BL||!BL.length||!inside())return;try{const{data,error}=await sb.rpc('sup_book_all',{p_key:G.key,p_lat:LOC?LOC.lat:null,p_lng:LOC?LOC.lng:null});if(error)throw error;BK=0;TS='تم حجز '+data+' طيار';setTimeout(()=>{TS='';render()},3000);await ST(1)}catch(e){alert('تعذر الحجز — تأكد من الاتصال وإنك في موقع الاستلام')}render()};
const bookUI=()=>BK?`<div class="cl"><div class="cd" style="text-align:start"><div class="b" style="font-size:18px">حجز للي في الموقع</div><div class="sc sm" style="margin:4px 0 12px">الطيارين اللي تطبيقهم مفتوح وهم في موقع الاستلام ومش حاجزين، بترتيب وصولهم</div>${BL==null?'<div class="sc">جاري التحميل…</div>':BL.length?`<div style="max-height:40vh;overflow:auto">${BL.map((x,i)=>`<div class="r" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span class="rk">${N(i+1)}</span><span class="b" style="flex:1">${E(x.name)}</span></div>`).join('')}</div>`:'<div class="sc">مفيش حد دلوقتي</div>'}<div class="ac" style="margin-top:14px"><button class="btn" ${BL&&BL.length?'':'disabled'} onclick="doBook()">حجز ${BL?N(BL.length):''} طيار</button><button class="b2" onclick="bk(0)">إلغاء</button></div></div></div>`:'';
const sendCall=async()=>{const t=CT.trim();if(!t||!inside())return;try{const{error}=await sb.rpc('sup_call',{p_key:G.key,p_text:t,p_lat:LOC?LOC.lat:null,p_lng:LOC?LOC.lng:null});if(error)throw error;CM=0;TS='تم إرسال النداء';setTimeout(()=>{TS='';render()},3000)}catch(e){alert(String(e&&e.message).includes('too_soon')?'استنى 10 ثواني بين كل نداء':'تعذر إرسال النداء — تأكد من الاتصال وإنك في موقع الاستلام')}render()};
const callUI=()=>CM?`<div class="cl"><div class="cd" style="text-align:start"><div class="b" style="font-size:18px">نداء للطيارين</div><div class="sc sm" style="margin:4px 0 12px">بيوصل للطيارين اللي في موقع الاستلام ومش حاجزين، مع صوت</div><textarea id="ct" maxlength="140" rows="3" oninput="CT=this.value">${E(CT)}</textarea><div class="chips">${PRE.map(p=>`<button class="chip" onclick="CT=this.textContent;render()">${E(p)}</button>`).join('')}</div><div class="ac"><button class="btn" onclick="sendCall()">إرسال النداء</button><button class="b2" onclick="cm(0)">إلغاء</button></div></div></div>`:'';
const snap=(m,id,sort)=>{const u={id,sort,m};U=u;setTimeout(()=>{if(U===u){U=null;render()}},5000)};
const fmt=d=>new Date(d).toLocaleTimeString('ar-EG-u-nu-latn',{hour:'numeric',minute:'2-digit'});
const act=async(fn,id,msg)=>{const x=Q.find(y=>y.id==id);if(!x||!inside())return;const{error}=await sb.rpc(fn,{p_key:G.key,p_id:Number(id),p_lat:LOC?LOC.lat:null,p_lng:LOC?LOC.lng:null});if(error){alert('تعذر تنفيذ الإجراء — تأكد من الاتصال وحاول تاني');return}snap(msg+x.name,id,x.sort);await ST(1)};
const rc=id=>Q[0]&&Q[0].id==id&&act('sup_receive',id,'تم تسجيل استلام '),pp=id=>Q.length>1&&act('sup_postpone',id,'تم تأجيل ');
const undo=async()=>{if(!U)return;const u=U;U=null;await sb.rpc('sup_undo',{p_key:G.key,p_id:Number(u.id),p_sort:u.sort});await ST(1)};
